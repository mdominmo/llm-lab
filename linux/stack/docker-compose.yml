# Open WebUI en el PC: interfaz web contra el motor del Mac.
# No hay proxy en medio. LM Studio ya sirve la API de OpenAI y expone todos
# los modelos que tengas descargados; el cliente elige con el campo `model`.
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports: ["3000:8080"]
    volumes:
      - ./open-webui-data:/app/backend/data
    # `macbook` sale de /etc/hosts del host, que el contenedor no ve.
    extra_hosts: ["macbook:${MACBOOK_IP}"]
    environment:
      OPENAI_API_BASE_URL: http://macbook:1234/v1
      OPENAI_API_KEY: lm-studio        # LM Studio no la valida, pero exige que exista
      WEBUI_AUTH: "false"
    restart: unless-stopped
