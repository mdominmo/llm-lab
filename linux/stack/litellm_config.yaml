# Modelos servidos por LiteLLM (§6.5). Solo local.
# Corre en el PC: el Mac se alcanza por el tailnet.
# Cambiar de motor de inferencia (llama.cpp, vllm-metal, ...) es cambiar
# `model` y `api_base` de la entrada local. Nada más del stack se entera.
model_list:
  - model_name: qwen3-coder                     # local
    litellm_params:
      model: openai/qwen/qwen3-coder-30b        # = id de /v1/models de LM Studio
      api_base: http://macbook:1234/v1
      api_key: "lm-studio"                      # no se usa, pero no puede ir vacío

litellm_settings:
  drop_params: true                             # descarta params que el endpoint local no soporta
  success_callback: ["sqlite"]                  # log de todas las peticiones

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
